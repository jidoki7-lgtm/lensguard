<script>
  const FRAME_COUNT = 3;

  function seekTo(video, timeSec) {
    return new Promise((resolve) => {
      const clamped = Math.max(0, Math.min(timeSec, (video.duration || 1) - 0.05));
      if (Math.abs(video.currentTime - clamped) < 0.03) {
        resolve();
        return;
      }
      const onSeeked = () => {
        video.removeEventListener("seeked", onSeeked);
        resolve();
      };
      video.addEventListener("seeked", onSeeked);
      video.currentTime = clamped;
    });
  }

  async function captureFrames(video, count = 3) {
    if (video.readyState < 1) {
      await new Promise((resolve, reject) => {
        video.addEventListener("loadedmetadata", resolve, { once: true });
        video.addEventListener("error", () => reject(new Error("영상을 불러올 수 없습니다.")), { once: true });
      });
    }
    const dur = video.duration || 1;
    const ratios = [0.05, 0.45, 0.85].slice(0, count);
    const out = [];

    for (const r of ratios) {
      await seekTo(video, dur * r);
      const vw = video.videoWidth || 640;
      const vh = video.videoHeight || 480;
      const maxW = 960;
      const scale = vw > maxW ? maxW / vw : 1;
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(vw * scale));
      canvas.height = Math.max(1, Math.round(vh * scale));
      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      out.push(canvas.toDataURL("image/jpeg", 0.82));
    }
    return out;
  }
</script>
