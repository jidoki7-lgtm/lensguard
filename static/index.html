<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LensGuard</title>
  <link rel="manifest" href="/manifest.json" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      background: #f4f6fb;
      color: #161922;
      padding: 16px;
    }
    .wrap {
      max-width: 520px;
      margin: 0 auto;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      margin-bottom: 14px;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 6px;
    }
    .sub {
      font-size: 13px;
      color: #5b6275;
      margin: 0 0 12px;
    }
    input[type="file"] {
      width: 100%;
      margin-bottom: 12px;
      font-size: 14px;
    }
    video {
      width: 100%;
      border-radius: 12px;
      background: #000;
      max-height: 260px;
      display: block;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #1d5cff;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled {
      background: #9bb3f5;
      cursor: not-allowed;
    }
    .status {
      margin-top: 10px;
      font-size: 14px;
      font-weight: 600;
      color: #2b3348;
    }
    .err {
      margin-top: 10px;
      padding: 12px;
      border-radius: 10px;
      background: #fff0f0;
      color: #b42318;
      font-size: 13px;
      white-space: pre-wrap;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: #e8f0ff;
      color: #1d5cff;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    pre {
      background: #f6f8fa;
      padding: 12px;
      border-radius: 10px;
      font-size: 12px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>LensGuard</h1>
      <p class="sub">1프레임 테스트 모드 · 영상을 선택하고 분석 시작을 누르세요.</p>
      <input id="videoInput" type="file" accept="video/*" />
      <video id="videoPreview" controls playsinline muted></video>
      <button id="analyzeBtn" disabled>분석 시작</button>
      <div id="statusText" class="status">영상을 선택해 주세요.</div>
      <div id="errorBox" class="err" style="display:none;"></div>
    </div>

    <div id="resultCard" class="card" style="display:none;">
      <div class="badge">분석 결과</div>
      <div id="summaryText"></div>
      <pre id="rawJson"></pre>
    </div>
  </div>

  <script>
    const FRAME_COUNT = 1; // 429 한도 테스트를 위해 1프레임만 전송

    const videoInput = document.getElementById("videoInput");
    const videoPreview = document.getElementById("videoPreview");
    const analyzeBtn = document.getElementById("analyzeBtn");
    const statusText = document.getElementById("statusText");
    const errorBox = document.getElementById("errorBox");
    const resultCard = document.getElementById("resultCard");
    const summaryText = document.getElementById("summaryText");
    const rawJson = document.getElementById("rawJson");

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = "block";
    }

    function clearError() {
      errorBox.textContent = "";
      errorBox.style.display = "none";
    }

    videoInput.addEventListener("change", () => {
      clearError();
      resultCard.style.display = "none";
      const file = videoInput.files && videoInput.files[0];
      if (!file) {
        analyzeBtn.disabled = true;
        statusText.textContent = "영상을 선택해 주세요.";
        return;
      }
      const url = URL.createObjectURL(file);
      videoPreview.src = url;
      videoPreview.load();
      analyzeBtn.disabled = false;
      statusText.textContent = "분석 준비 완료 (1프레임 추출)";
    });

    function captureOneFrame(video) {
      return new Promise((resolve, reject) => {
        const run = () => {
          try {
            const vw = video.videoWidth || 640;
            const vh = video.videoHeight || 480;
            const maxW = 960;
            const scale = vw > maxW ? maxW / vw : 1;
            const canvas = document.createElement("canvas");
            canvas.width = Math.max(1, Math.round(vw * scale));
            canvas.height = Math.max(1, Math.round(vh * scale));
            const ctx = canvas.getContext("2d");
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL("image/jpeg", 0.8);
            resolve([dataUrl]);
          } catch (e) {
            reject(e);
          }
        };

        if (video.readyState >= 2) {
          run();
        } else {
          video.addEventListener("loadeddata", run, { once: true });
          video.addEventListener("error", () => reject(new Error("영상을 불러올 수 없습니다.")), { once: true });
        }
      });
    }

    analyzeBtn.addEventListener("click", async () => {
      clearError();
      resultCard.style.display = "none";
      analyzeBtn.disabled = true;
      statusText.textContent = `${FRAME_COUNT}프레임 추출 중...`;

      try {
        const frames = await captureOneFrame(videoPreview);
        statusText.textContent = "서버로 전송 및 분석 중...";

        const res = await fetch("/api/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ frames }),
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || `서버 오류 (${res.status})`);
        }

        const results = Array.isArray(data.results) ? data.results : [];
        const okCount = results.filter((r) => r && !r.error).length;
        const firstErr = results.find((r) => r && r.error);

        statusText.textContent = "분석 완료";
        resultCard.style.display = "block";
        summaryText.innerHTML = `<strong>성공 프레임:</strong> ${okCount}/${results.length} · <strong>모드:</strong> ${data.mock ? "MOCK" : "실제 AI"}`;
        rawJson.textContent = JSON.stringify(data, null, 2);

        if (firstErr) {
          showError(`프레임 #${firstErr.index} 오류: ${firstErr.error}`);
        }
      } catch (e) {
        statusText.textContent = "분석 실패";
        showError(e.message || String(e));
      } finally {
        analyzeBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
